<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva tu plaza en Español con Jordi</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --cream: #F7EFDC;
    --cream-dark: #EFE1BE;
    --olive: #5C6B3B;
    --olive-dark: #40492A;
    --terracotta: #D9822E;
    --terracotta-dark: #B5691F;
    --ink: #3A3122;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--olive-dark);
    margin: 0 0 6px;
    font-size: clamp(24px, 5vw, 32px);
  }

  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }

  a.back {
    display: inline-block;
    margin-bottom: 24px;
    font-size: 14px;
    color: var(--olive-dark);
    text-decoration: none;
    font-weight: 700;
  }

  p.lead {
    color: #5A5340;
    margin: 0 0 28px;
  }

  form {
    background: var(--cream-dark);
    border-radius: 16px;
    padding: 28px 24px;
    border: 1px solid rgba(90, 63, 40, 0.12);
  }

  label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    color: var(--olive-dark);
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 18px;
  }

  input[type=text], input[type=tel], textarea, select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid rgba(90, 63, 40, 0.25);
    background: #fff;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
  }

  textarea { resize: vertical; min-height: 70px; }

  .required { color: var(--terracotta-dark); }

  .submit-btn {
    width: 100%;
    background: var(--terracotta);
    color: #fff;
    font-weight: 700;
    border: none;
    padding: 14px 20px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(217, 130, 46, 0.35);
  }
  .submit-btn:hover { background: var(--terracotta-dark); }

  .thanks {
    display: none;
    text-align: center;
    background: var(--cream-dark);
    border-radius: 16px;
    padding: 40px 24px;
    border: 1px solid rgba(90, 63, 40, 0.12);
  }

  .thanks h2 {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--olive-dark);
  }

  /* LANGUAGE SWITCH */
  .lang-switch {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 10000;
    display: flex;
    background: var(--cream-dark);
    border: 1px solid rgba(90, 63, 40, 0.2);
    border-radius: 999px;
    padding: 3px;
    box-shadow: 0 4px 10px rgba(90, 63, 40, 0.15);
  }

  .lang-btn {
    border: none;
    background: transparent;
    color: var(--olive-dark);
    font-weight: 700;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }

  .lang-btn.active {
    background: var(--terracotta);
    color: #fff;
  }
</style>
</head>
<body>

  <div class="lang-switch" id="langSwitch">
    <button type="button" class="lang-btn" data-lang="es">ES</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>

  <div class="wrap">
    <a class="back" href="index.html" data-i18n="backLink">← Volver a los cursos</a>
    <h1 data-i18n="h1">Reserva tu plaza</h1>
    <p class="lead" data-i18n="lead">Rellena tus datos y te escribo por email en menos de 24h para confirmar tu plaza.</p>

    <form id="inscripcionForm">
      <div class="field">
        <label for="nombre" data-i18n-html="nombreLabel">¿Cómo te llamas? <span class="required">*</span></label>
        <input type="text" id="nombre" required>
      </div>

      <div class="field">
        <label for="pais" data-i18n-html="paisLabel">¿En qué país vives y cuál es tu lengua materna? <span class="required">*</span></label>
        <input type="text" id="pais" required>
      </div>

      <div class="field">
        <label for="nivel" data-i18n-html="nivelLabel">¿Para qué nivel quieres prepararte? (horario de Madrid) <span class="required">*</span></label>
        <select id="nivel" required>
          <option value="" data-i18n="selectPlaceholder">Selecciona un nivel</option>
          <option value="A2 (de 17:30 a 19:00)" data-i18n="optA2">A2 (martes y jueves, de 17:30 a 19:00)</option>
          <option value="B1 (de 17:15 a 18:45)" data-i18n="optB1">B1 (lunes y miércoles, de 17:15 a 18:45)</option>
          <option value="B2 (de 19:00 a 20:30)" data-i18n="optB2">B2 (lunes y miércoles, de 19:00 a 20:30)</option>
          <option value="C1 (de 15:30 a 17:00)" data-i18n="optC1">C1 (martes y jueves, de 15:30 a 17:00)</option>
        </select>
      </div>

      <div class="field">
        <label for="whatsapp" data-i18n-html="whatsappLabel">Número de WhatsApp o email para contactar contigo <span class="required">*</span></label>
        <input type="tel" id="whatsapp" required>
      </div>

      <div class="field">
        <label for="duda" data-i18n="dudaLabel">¿Alguna duda?</label>
        <textarea id="duda"></textarea>
      </div>

      <button type="submit" class="submit-btn" data-i18n="submitBtn">Enviar</button>
    </form>

    <div class="thanks" id="thanks">
      <h2 data-i18n="thanksTitle">¡Gracias!</h2>
      <p data-i18n="thanksText">Te escribo por email en menos de 24h para confirmar tu plaza.</p>
    </div>
  </div>

  <!-- Envío silencioso al formulario real de Google -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
  <form id="gform"
        action="https://docs.google.com/forms/d/e/1FAIpQLScMv5Tm5l31CUkk5w17WnYIB-g1LlPQHKOgNLi4W872bhERLw/formResponse"
        method="POST" target="hidden_iframe" style="display:none;">
    <input type="text" name="entry.368829682" id="g-nombre">
    <input type="text" name="entry.1825855586" id="g-pais">
    <input type="text" name="entry.8186469" id="g-nivel">
    <input type="text" name="entry.174317246" id="g-whatsapp">
    <input type="text" name="entry.609687656" id="g-duda">
  </form>

  <script>
    var params = new URLSearchParams(window.location.search);
    var nivelParam = params.get('nivel');
    var nivelMap = {
      A2: "A2 (de 17:30 a 19:00)",
      B1: "B1 (de 17:15 a 18:45)",
      B2: "B2 (de 19:00 a 20:30)",
      C1: "C1 (de 15:30 a 17:00)"
    };
    if (nivelParam && nivelMap[nivelParam]) {
      document.getElementById('nivel').value = nivelMap[nivelParam];
    }

    document.getElementById('inscripcionForm').addEventListener('submit', function (e) {
      e.preventDefault();

      document.getElementById('g-nombre').value = document.getElementById('nombre').value;
      document.getElementById('g-pais').value = document.getElementById('pais').value;
      document.getElementById('g-nivel').value = document.getElementById('nivel').value;
      document.getElementById('g-whatsapp').value = document.getElementById('whatsapp').value;
      document.getElementById('g-duda').value = document.getElementById('duda').value;

      document.getElementById('gform').submit();

      document.getElementById('inscripcionForm').style.display = 'none';
      document.getElementById('thanks').style.display = 'block';
    });

    var translations = {
      es: {
        pageTitle: `Reserva tu plaza en Español con Jordi`,
        backLink: `← Volver a los cursos`,
        h1: `Reserva tu plaza`,
        lead: `Rellena tus datos y te escribo por email en menos de 24h para confirmar tu plaza.`,
        nombreLabel: `¿Cómo te llamas? <span class="required">*</span>`,
        paisLabel: `¿En qué país vives y cuál es tu lengua materna? <span class="required">*</span>`,
        nivelLabel: `¿Para qué nivel quieres prepararte? (horario de Madrid) <span class="required">*</span>`,
        selectPlaceholder: `Selecciona un nivel`,
        optA2: `A2 (martes y jueves, de 17:30 a 19:00)`,
        optB1: `B1 (lunes y miércoles, de 17:15 a 18:45)`,
        optB2: `B2 (lunes y miércoles, de 19:00 a 20:30)`,
        optC1: `C1 (martes y jueves, de 15:30 a 17:00)`,
        whatsappLabel: `Número de WhatsApp o email para contactar contigo <span class="required">*</span>`,
        dudaLabel: `¿Alguna duda?`,
        submitBtn: `Enviar`,
        thanksTitle: `¡Gracias!`,
        thanksText: `Te escribo por email en menos de 24h para confirmar tu plaza.`
      },
      en: {
        pageTitle: `Reserve your spot with Spanish with Jordi`,
        backLink: `← Back to courses`,
        h1: `Reserve your spot`,
        lead: `Fill in your details and I'll email you within 24h to confirm your spot.`,
        nombreLabel: `What's your name? <span class="required">*</span>`,
        paisLabel: `What country do you live in and what's your native language? <span class="required">*</span>`,
        nivelLabel: `Which level do you want to prepare for? (Madrid time) <span class="required">*</span>`,
        selectPlaceholder: `Select a level`,
        optA2: `A2 (Tuesdays and Thursdays, 17:30-19:00)`,
        optB1: `B1 (Mondays and Wednesdays, 17:15-18:45)`,
        optB2: `B2 (Mondays and Wednesdays, 19:00-20:30)`,
        optC1: `C1 (Tuesdays and Thursdays, 15:30-17:00)`,
        whatsappLabel: `WhatsApp number or email to reach you <span class="required">*</span>`,
        dudaLabel: `Any questions?`,
        submitBtn: `Submit`,
        thanksTitle: `Thank you!`,
        thanksText: `I'll email you within 24h to confirm your spot.`
      }
    };

    function applyLanguage(lang) {
      var dict = translations[lang] || translations.es;
      document.documentElement.lang = lang;
      document.title = dict.pageTitle;

      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) el.textContent = dict[key];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
        var key = el.getAttribute('data-i18n-html');
        if (dict[key] !== undefined) el.innerHTML = dict[key];
      });

      document.querySelectorAll('.lang-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });

      localStorage.setItem('siteLang', lang);
    }

    document.querySelectorAll('.lang-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        applyLanguage(btn.getAttribute('data-lang'));
      });
    });

    applyLanguage(localStorage.getItem('siteLang') || 'es');
  </script>

</body>
</html>
